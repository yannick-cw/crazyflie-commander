[package]
name = "mission-computer"
version = "0.1.0"
edition = "2024"

[[bin]]
path = "src/main.rs"
name = "mission-computer"


[dependencies]
datalink = { path = "../datalink" }
tonic = "0.14.6"
anyhow = "1.0.104"
crazyflie-lib = "0.8.0"
crazyflie-link = "0.5.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
derive_more = { version = "2.1.1", features = ["full"] }
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"]}
tracing = "0.1.44"
fastrand = "2.5.0"
tracing-subscriber = "0.3.23"

[dev-dependencies]
proptest = "1.11.0"
test-strategy = "0.4.5"
