syntax = "proto3";
import "telemetry.proto";
import "grid.proto";
import "google/protobuf/empty.proto";

package downlink;

service StreamTelemetry {
  // telemetry link streaming - state at 100hz, health at 1hz, mission satus when available
  rpc StreamTelemetry (google.protobuf.Empty) returns (stream Message) {}

  // payload link streaming the occupancy grid at 10hz
  rpc StreamPayload (google.protobuf.Empty) returns (stream OccupancyGrid) {}
}
