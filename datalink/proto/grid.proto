syntax = "proto3";

package downlink;

message OccupancyGrid {
  oneof msg {
    KeyframeGrid keyframe = 1;
    ChangedCells changes = 2;
  }
}

message KeyframeGrid {
  message ListOfCells {
    // mapped to -50..50
    repeated  sint32 quantized_odds = 1;
  }
  repeated ListOfCells lists = 1;
}

message ChangedCells {
  message ChangedCell {
    sint32 quantized_odds = 1;
    int32 i = 2;
    int32 j = 3;
  }
  repeated ChangedCell cells = 1;
}