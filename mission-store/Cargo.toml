[package]
name = "mission-store"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "mission-store"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
drone-control = { path = "../drone-control" }
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
reqwest = { version = "0.13.4", features = ["json"] }
