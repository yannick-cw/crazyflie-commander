[package]
name = "mission-store"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "mission-store"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
drone-control = { path = "../drone-control" }
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
sqlx = {
    version = "0.9.0",
    default-features = false,
    features = ["runtime-tokio", "tls-rustls", "macros", "postgres", "uuid", "chrono", "migrate"]
}
config = { version = "0.15.25" }
uuid = { version = "1.24.0", features = ["v4"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = "0.1.44"
tower-http = { version = "0.7.0", features = ["trace", "request-id", "propagate-header", "util"] }
tracing-bunyan-formatter = "0.3.10"
tower = { version = "0.5.3" }
secrecy = { version = "0.10.3", features = ["serde"] }
thiserror = "2.0.19"
rand = "0.10.2"

[dev-dependencies]
reqwest = { version = "0.13.4", features = ["json"] }
quickcheck = { version = "1.1.0" }
quickcheck_macros = "1.2.0"
fake = { version = "5.1.0", features = ["derive"] }
